# Lingua Mia on Netlify.
#
# The site is plain static files — no build, no bundler, no framework — so "publish" is simply the
# folder the browser gets. Only three things need a server at all: Claude, speech synthesis, and
# telling the page which Supabase project it belongs to. Everything else (sign-in, progress, the
# leaderboard) goes straight from the browser to Supabase.

[build]
  publish = "public"
  command = "echo 'static site — nothing to build'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The app calls /api/* exactly as it did against the old local server, so nothing in the client
# had to learn where it is deployed.
[[redirects]]
  from = "/api/tutor"
  to = "/.netlify/functions/tutor"
  status = 200

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

# Админка вызывается тем же способом, что и остальные три. Правила для неё тут не было: работало
# оно только потому, что Netlify отдаёт функции ещё и по /.netlify/functions/*, а клиент зовёт
# /api/admin. Одна опечатка в этом запасном пути — и панель владельца молча перестаёт открываться.
[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

# Single page app: every other path is the app itself, so a reload on #/profile does not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Ни одного стороннего скрипта. Supabase теперь лежит в public/vendor/ (см. backend.js), так
    # что script-src — только 'self': код, исполняющийся рядом с полем пароля, может быть только
    # нашим. Разговариваем с самим собой, с Supabase и больше ни с кем; звук приходит из Storage.
    #
    # base-uri и form-action перечислены отдельно НЕ для красоты: эти две директивы от default-src
    # не наследуются. Без base-uri внедрённый <base> уводит все относительные адреса — включая
    # импорт того самого vendor/supabase-js.mjs — на чужой сервер. Без form-action туда же уходит
    # отправка формы. object-src 'none' закрывает <object>/<embed>, которых на сайте нет.
    # Шрифты тоже свои (public/fonts), поэтому ни style-src, ни font-src наружу не смотрят.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"

# Mia's voice never changes once it is synthesised — the cache key contains the text and every
# voice setting — so it can be cached hard.
[[headers]]
  for = "/.netlify/functions/tts"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  publish = "public"
  port = 8888
